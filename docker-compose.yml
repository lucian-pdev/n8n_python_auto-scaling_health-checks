# version: "3.8"

services:
  # Traefik - reverse proxy + automatic Let's Encrypt TLS (replaces host nginx + certbot)
  # Only containers with the label traefik.enable=true are exposed (n8n-main, grafana).
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${TRAEFIK_NETWORK:-naypyers-proxy}   # the REAL Docker name (see networks.proxy)
      # :80 only answers the ACME HTTP challenge and redirects everything else to :443
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=3600s   # v3 default is 60s; long n8n uploads need more
      - --certificatesresolvers.le.acme.email=${EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --ping=true
      - --api.dashboard=true
      - --api.insecure=true            # dashboard + /metrics on :8080, published to localhost only
      - --metrics.prometheus=true
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
      - ${TRAEFIK_DASHBOARD_PUBLISHED_PORT:-127.0.0.1:8082:8080}   # host 8080 is taken by cAdvisor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - proxy
      - monitoring
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    stop_grace_period: 10m      # clean shutdown (checkpoint) instead of a kill after Docker's default 10 s
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8n}
      - POSTGRES_DB=n8n
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - n8n-network
    restart: unless-stopped
    
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    stop_grace_period: 10m      # time to flush the queue to disk before Docker gives up and kills it
    # exec: redis-server becomes PID 1 and receives Docker's stop signal (a plain sh -c swallows it)
    command: >
      sh -c "exec redis-server 
      --appendonly yes
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    networks:
      - n8n-network

  # Python FastAPI Service
  python-api:
    build:
      context: ./python-api
      dockerfile: Dockerfile
    container_name: python-api
    volumes:
      - ./scripts:/app/scripts:ro
      - ./job-output:/app/output
    ports:
      - ${PYTHON_API_PUBLISHED_PORT:-127.0.0.1:8000:8000}
    networks:
      - n8n-network
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      - MALLOC_TRIM_THRESHOLD_=65536
      - MALLOC_MMAP_THRESHOLD_=131072
      - MALLOC_ARENA_MAX=2
    deploy:
      resources:
        limits:
          memory: 1500m
        reservations:
          memory: 256m

  # Prometheus Metrics Server
  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/conf.d:/etc/prometheus/conf.d:ro      # local extra scrape targets (see prometheus.yml)
      - prometheus-data:/prometheus
    ports:
      - ${PROMETHEUS_PUBLISHED_PORT:-127.0.0.1:9090:9090}
    networks:
      - monitoring
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:main-ubuntu
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${DOMAIN}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - ${GRAFANA_PUBLISHED_PORT:-127.0.0.1:3000:3000}
    networks:
      - monitoring
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`${DOMAIN}`) && PathPrefix(`/grafana`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    restart: unless-stopped
    depends_on:
      - prometheus

  # cAdvisor - Container Metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - ${CADVISOR_PUBLISHED_PORT:-127.0.0.1:8080:8080}
    networks:
      - monitoring
    restart: unless-stopped

  # Node Exporter - Host Metrics
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
    ports:
      - ${NODE_EXPORTER_PUBLISHED_PORT:-127.0.0.1:9100:9100}
    networks:
      - monitoring
    restart: unless-stopped


  # n8n Workflow Automation
  n8n-main:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    container_name: n8n-main
    restart: unless-stopped
    environment:
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}
      - N8N_PUSH_BACKEND=websocket
      - NODE_ENV=production
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-pass}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - N8N_HOST=${DOMAIN}
      - WEBHOOK_URL=https://${DOMAIN}/
      - N8N_PROXY_HOPS=1            # trust X-Forwarded-For from Traefik
      - EXECUTIONS_MODE=queue       # Controls whether executions run in the main process or a subprocess.
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_DB=0     # You can isolate n8n by using a different DB number.
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD:-}   # Leave empty if Redis has no password
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-True}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-replace_me}
      # n8n-main and n8n-workers must have the SAME key
      - GENERIC_TIMEZONE=UTC
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USERNAME:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n}
      # Prometheus /metrics (scraped over the monitoring network; blocked publicly by the n8n-metrics router)
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_QUEUE_METRICS=true    # n8n_scaling_mode_queue_jobs_{waiting,active,completed,failed}
      - N8N_METRICS_INCLUDE_DEFAULT_METRICS=true  # Node.js process: CPU, memory, event loop lag
    ports:
      - ${N8N_PUBLISHED_PORT:-127.0.0.1:5678:5678}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./job-output:/home/node/job-output
    networks:
      - n8n-network
      - monitoring
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      # /metrics has no auth: longer rule beats the n8n router, allowlist only localhost -> 403 for everyone else
      - traefik.http.routers.n8n-metrics.rule=Host(`${DOMAIN}`) && Path(`/metrics`)
      - traefik.http.routers.n8n-metrics.entrypoints=websecure
      - traefik.http.routers.n8n-metrics.service=n8n
      - traefik.http.routers.n8n-metrics.middlewares=deny-public
      - traefik.http.middlewares.deny-public.ipallowlist.sourcerange=127.0.0.1/32
    depends_on:
      - redis

  # no container_name: the autoscaler runs `docker compose --scale n8n-worker=N`, which needs unique names
  n8n-worker:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    command: ["worker", "--concurrency=4"]
    environment:
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}
      - EXECUTIONS_MODE=queue
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - N8N_HOST=${DOMAIN}
      - WEBHOOK_URL=https://${DOMAIN}/
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_DB=0
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-replace_me}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USERNAME:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n}
      - N8N_METRICS=true
      - QUEUE_HEALTH_CHECK_ACTIVE=true            # worker HTTP server on :5678 (/healthz, /metrics)
    networks:
      - n8n-network
      - monitoring                                # Prometheus finds every replica via dns_sd_configs
    volumes:
      - ./job-output:/home/node/job-output
    depends_on:
      - redis
      - n8n-main

volumes:
  prometheus-data:
  grafana-data:
  redis-data:
  n8n-data:
  postgres-data:
  traefik-letsencrypt:      # acme.json (certs + LE account key)

networks:
  n8n-network:
    driver: bridge
  monitoring:
    driver: bridge
  proxy:                    # Traefik <-> publicly routed services only
    driver: bridge
    # Fixed Docker name. Compose would prefix it with the project (naypyers_proxy, <other-folder>_proxy), and
    # Traefik's providers.docker.network needs the exact name: on a mismatch Traefik logs "Could not find
    # network" and routes to the container's FIRST network, which may be one Traefik isn't on (504).
    name: ${TRAEFIK_NETWORK:-naypyers-proxy}
