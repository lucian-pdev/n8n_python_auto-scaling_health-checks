# naypyers settings for the upgrade workflow (generic scripts from Project_Testing/templates/upgrade).
# Sourced as bash by every script in this folder. Hostinger installs: use the hostinger branch's own procedure.

UPGRADE_NAME=naypyers
COMPOSE_FILES=(docker-compose.yml)

# deploy.sh is safe to rerun: it keeps an existing .env, rebuilds python-api, `docker compose up -d`,
# reinstalls the systemd timers and the firewall rules
DEPLOY_CMD="bash ./deploy.sh"
ENV_TEMPLATE=env
ENV_RENAMES=()

# autoscaler runs `docker compose up --scale` every 30 s; github_sync rewrites scripts/
TIMERS=(autoscaler.timer github_sync.timer)
HOST_FILES=(/etc/systemd/system/autoscaler.service /etc/systemd/system/autoscaler.timer
            /etc/systemd/system/github_sync.service /etc/systemd/system/github_sync.timer
            /usr/local/bin/autoscaler.sh /usr/local/bin/github_sync.sh)
BACKUP_VOLUMES=(n8n-data grafana-data traefik-letsencrypt)
DATA_DIRS=(job-output n8n-data grafana-data prometheus-data postgres-data redis-data)
HEALTH_URLS=("http://127.0.0.1:8000/health" "http://127.0.0.1:5678/healthz/readiness")
PREFLIGHT_ALLOW_CHANGE=()

# n8n's own exports next to the database dump (credentials stay encrypted with N8N_ENCRYPTION_KEY)
backup_extra() {
    local out="$1" what
    for what in workflow credentials; do
        if dc exec -T n8n-main n8n "export:$what" --all --output="/home/node/.n8n/upgrade-$what.json" &>/dev/null; then
            dc cp "n8n-main:/home/node/.n8n/upgrade-$what.json" "$out/n8n-$what.json" &>/dev/null
            dc exec -T n8n-main rm -f "/home/node/.n8n/upgrade-$what.json"
        else
            warn "n8n export:$what failed (the database dump still has them)"
        fi
    done
    dc exec -T n8n-main n8n --version > "$out/n8n-version.txt" 2>/dev/null || true
}

# scripts python-api serves (synced from the scripts repo): must still be there
inventory_extra() { ls -1 scripts 2>/dev/null | grep -vE '^(README|.*\.md)$' | sed 's/^/script /'; }
