global:
  scrape_interval: 15s

# Deployment-specific extra targets (e.g. a postgres-exporter from another project): one file per job in
# prometheus/conf.d/*.yml (not tracked in git), each holding a list of scrape configs. Missing dir = none.
scrape_config_files:
  - /etc/prometheus/conf.d/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'python-api'
    static_configs:
      - targets: ['python-api:8000']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']

  - job_name: 'n8n-main'
    static_configs:
      - targets: ['n8n-main:5678']

  # Scaled service: name resolves to every replica's IP, re-resolved each refresh
  - job_name: 'n8n-worker'
    dns_sd_configs:
      - names: ['n8n-worker']
        type: A
        port: 5678
