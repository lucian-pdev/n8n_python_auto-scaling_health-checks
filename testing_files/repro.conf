# Rehearsal of the generic upgrade workflow (upgrade/) on a fresh VM: Project_Testing remote_deployment/repro.sh
# and its Jenkins jobs (repro-upgrade with OS_UPDATE=true). Sourced as bash; hooks run on the VM in REPRO_DIR.
#
# Start: this branch with n8n pinned REPRO_N8N_OLD, seeded like production (owner + saved login, encrypted
# credential, scheduled workflow writing to Postgres, webhook). Then the OS update (old-kernel template), then
# switch-code -> migrate-env -> n8n bumped to REPRO_N8N_NEW -> preflight -> apply -> verify + app checks.

REPRO_OLD_REF=main
REPRO_NEW_REF=main
REPRO_DIR=naypyers
REPRO_TEMPLATE_VMID=                   # an old-kernel Ubuntu template rehearses the OS update too
REPRO_HOOKS_DIR=testing_files/repro
# n8n before / after the upgrade (read on the VM by repro/procedure.sh)
REPRO_N8N_OLD=2.41.7
REPRO_N8N_NEW=2.43.3

REPRO_DEPLOY_OLD='bash "$REPRO_HOOKS/procedure.sh" deploy-old'
REPRO_SEED='bash "$REPRO_HOOKS/seed.sh"'
REPRO_BASELINE='bash "$REPRO_HOOKS/check-app.sh"'
REPRO_FETCH='bash "$REPRO_HOOKS/procedure.sh" fetch'
REPRO_OS_BEFORE='bash "$REPRO_HOOKS/procedure.sh" os-before'      # repro.sh reboots after this if needed
REPRO_OS_AFTER='bash "$REPRO_HOOKS/procedure.sh" os-after'
REPRO_UPGRADE='bash "$REPRO_HOOKS/procedure.sh" upgrade'
REPRO_VERIFY='bash "$REPRO_HOOKS/procedure.sh" verify && bash "$REPRO_HOOKS/check-app.sh"'
