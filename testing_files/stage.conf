# Staging hooks for VM / remote test runs (sourced as bash by the staging runner).
# See "Testing Documentation.md" in this directory.

# Run in the project dir on the target before provisioning: build .env from the test template
# (bind-mounted dirs created now, as the deploy user: docker would create them as root)
STAGE_SETUP="./env-maker.sh testing_files/env && mkdir -p scripts job-output"

# Provisioning command, run in the project dir on the target
STAGE_PROVISION="bash ./deploy.sh testing_files/env"

# Host env vars copied into the target's .env when set: "HOST_VAR:FILE:KEY"
STAGE_HOST_VARS=("SCRIPTS_REPO:.env:SCRIPTS_REPO" "SCRIPTS_BRANCH:.env:SCRIPTS_BRANCH" "SCRIPTS_TOKEN:.env:GITHUB_TOKEN")

# Retried after provisioning until python-api answers
STAGE_HEALTHCHECK="curl -fsS http://localhost:8000/health"
